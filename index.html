<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploradores do Mundo Digital</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/images/ui/favicon.png" type="image/png">
</head>

<body>
  <div class="container">
    <img
      src="assets/images/worlds/world-1.jpg"
      alt="Mapa do Mundo 1"
      class="mapa"
      onclick="tocarSom()"
    >

    <a
      href="https://docs.google.com/document/d/1wflAcgpV5LDLaA75kwB3InIVKpug_425OG0B3ozZwD0/edit?usp=sharing"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="assets/images/characters/mario-stage-1.gif"
        class="mario"
        style="top: 435px; left: 148px;"
        alt="Mario"
      >
    </a>

    <img
      src="assets/images/ui/hint-block.gif"
      class="objeto"
      style="top: 203px; left: 543px;"
      onclick="mostrarMensagem(event, 'Ctrl + C = Copiar')"
      alt="Bloco de dica: copiar"
    >

    <img
      src="assets/images/ui/hint-block.gif"
      class="objeto"
      style="top: 203px; left: 589px;"
      onclick="mostrarMensagem(event, 'Ctrl + V = Colar')"
      alt="Bloco de dica: colar"
    >

    <img
      src="assets/images/ui/hint-block.gif"
      class="objeto"
      style="top: 360px; left: 434px;"
      onclick="mostrarMensagem(event, 'Ctrl + X = Recortar')"
      alt="Bloco de dica: recortar"
    >

    <img
      src="assets/images/ui/hint-block.gif"
      class="objeto"
      style="top: 360px; left: 480px;"
      onclick="mostrarMensagem(event, 'Ctrl + V = Colar')"
      alt="Bloco de dica: colar"
    >
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    const som = new Audio('assets/audio/stage-1-theme.mp3');

    function tocarSom() {
      som.play().catch((error) => {
        console.log('Erro ao reproduzir o som:', error);
      });
    }
  </script>
</body>
</html>
