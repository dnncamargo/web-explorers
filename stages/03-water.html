<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bem-vindo à fase da água</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="icon" href="../assets/images/ui/favicon.png" type="image/png">
</head>

<body>
  <div class="container">
    <img
      src="../assets/images/worlds/world-3.png"
      alt="Mapa do Mundo 3"
      class="mapa"
      onclick="tocarSom()"
    >

    <a
      href="https://docs.google.com/document/d/193ykgReOJX_QEB1PWsmCIHXRZjIj8yTKPCCkcpHoo-4/edit?usp=sharing"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="../assets/images/characters/mario-frog.gif"
        class="mario"
        style="top: 248px; left: 270px;"
        alt="Mario sapo"
      >
    </a>

    <img
      src="../assets/images/ui/hint-block.gif"
      class="objeto"
      style="top: 355px; left: 465px;"
      onclick="mostrarMensagem(event, 'Ctrl + ENTER = Renomear')"
      alt="Bloco de dica: renomear"
    >
  </div>

  <script src="../assets/js/main.js"></script>
  <script>
    const som = new Audio('../assets/audio/stage-3-underwater.mp3');

    function tocarSom() {
      som.play().catch((error) => {
        console.log('Erro ao reproduzir o som:', error);
      });
    }
  </script>
</body>
</html>
